certMaker:
  handler: handler.generate_certificate_handler
  layers:
    - Ref: WeazyprintLambdaLayer
    - Ref: PythonRequirementsLambdaLayer
  timeout: 900
  events:
    - sqs:
        arn:
          "Fn::GetAtt": [CertificateQueue, Arn]
  iamRoleStatements:
    - Effect: Allow
      Action:
        - "sqs:*"
      Resource:
        - "Fn::GetAtt": [CertificateQueue, Arn]
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
      Resource:
        - arn:aws:s3:::${self:custom.bucket}
        - arn:aws:s3:::${self:custom.bucket}/*
    - Effect: Allow
      Action:
        - dynamodb:*
      Resource:
        - arn:aws:dynamodb:ap-southeast-1:${aws:accountId}:table/${self:custom.stage}-${self:custom.projectName}-entities
        - arn:aws:dynamodb:ap-southeast-1:${aws:accountId}:table/${self:custom.stage}-${self:custom.projectName}-registrations
        - arn:aws:dynamodb:ap-southeast-1:${aws:accountId}:table/${self:custom.stage}-${self:custom.projectName}-events
        - arn:aws:dynamodb:ap-southeast-1:${aws:accountId}:table/${self:custom.stage}-${self:custom.projectName}-events/index/*
